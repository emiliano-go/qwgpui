[package]
name = "vault"
version = "0.1.0"
edition = "2021"
description = "Native GPUI Bitwarden client backed by rbw"
license = "MIT"

[dependencies]
async-trait = "0.1"
gpui = "0.2.2"
# gpui -> zed-async-tar -> xattr 0.2.3 still references libc::ENOATTR,
# which was removed in libc 0.2.191. Keep the last compatible release.
libc = "=0.2.189"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time"] }
toml = "0.8"
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
